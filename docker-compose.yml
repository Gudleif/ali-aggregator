services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  web:
    build: .
    env_file:
      - .env
    command: python src/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis  # <--- Добавили, чтобы веб-сервер ждал запуск Redis

  redis:
    image: redis:7-alpine
    container_name: pc_redis
    ports:
      - "6379:6379"
    restart: always

  celery_worker:
    build: .
    container_name: pc_celery_worker
    command: celery --workdir=src -A core worker -l INFO  # <--- Указали рабочую папку src
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: always

  celery_beat:
    build: .
    container_name: pc_celery_beat
    command: celery --workdir=src -A core beat -l INFO    # <--- Указали рабочую папку src
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: always

volumes:
  postgres_data: